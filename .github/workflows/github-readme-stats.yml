name: Generate GitHub Readme Stats
on:
  schedule:
    - cron: '0 0 * * *' # Roda diariamente
  workflow_dispatch:     # Permite rodar manualmente

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Stats Card
        uses: github-readme-stats/github-readme-stats-action@v1 # <--- Esta é a oficial do Marketplace
        with:
          gh_token: ${{ secrets.PAT_TOKEN }}
          user: Miki000000
          theme: dracula
          show-icons: true
          count-private: true
          card: stats
          path: profile/stats.svg
          options: "theme=dracula&show_icons=true"
      - name: Commit & Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update stats" || exit 0
          git push
