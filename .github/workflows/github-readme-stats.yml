name: Generate Stats Images
on:
  schedule:
    - cron: '0 0 * * *' # Executa diariamente à meia-noite
  workflow_dispatch: # Permite execução manual

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Generate Stats
        uses: anuraghazra/github-readme-stats-action@v1 # Exemplo de action compatível
        with:
          gh_token: ${{ secrets.PAT_TOKEN }}
          user: Miki000000
          theme: dracula
          show-icons: true
          count-private: true
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          git commit -m "Update stats images" || exit 0
          git push
